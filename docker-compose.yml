version: "3.8"

services:

  postgres:
    image: postgres:15
    container_name: result_postgres
    restart: always
    environment:
      POSTGRES_USER: cc_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: classcrafters
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: result_redis
    ports:
      - "6379:6379"

  ml:
    build: ./ml-service
    container_name: result_ml
    ports:
      - "8000:8000"

  backend:
    build: .
    container_name: result_backend
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
      - ml
    environment:
      DATABASE_URL: postgresql://cc_user:password123@postgres:5432/classcrafters
      ML_HOST: ml
      ML_PORT: 8000
      REDIS_HOST: redis

volumes:
  postgres_data: